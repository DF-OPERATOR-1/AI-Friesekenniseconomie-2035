<!doctype html>
<html lang="nl-NL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Index Fryslân: een onderzoeksplatform in ontwikkeling over AI en de Friese arbeidsmarkt. Verken bestaande AI-beroepsscores, brongegevens en de onderzoeksagenda tot 2035."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('ai-index-theme');
        } catch {}
        document.documentElement.dataset.theme =
          preference === 'light' || preference === 'dark' ? preference : 'light';
      })();
    </script>
    <title>AI Index Fryslân — AI en de Friese arbeidsmarkt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
