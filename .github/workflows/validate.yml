name: Validate atlas
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: python3 -m pip install -r requirements-ci.txt
      - run: python3 website/scripts/check_repository.py
      - run: python3 -m research.pipeline.imports.build_atlas
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci
        working-directory: website
      - run: npm run format:check
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-review
          path: website/dist
# Geen automatische deployment: publicatie uitsluitend na expliciete toestemming.
